<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>内部 H5 2 数据说明 · SSO Demo</title>
    <link rel="stylesheet" href="/assets/app.css">
    <script src="/assets/storage-diagnostics.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <article class="policy-card">
        <p class="eyebrow">SuperApp 内部 H5 2 SSO Demo</p>
        <h1>内部服务数据说明</h1>

        <h2>演示目的</h2>
        <p>本页面仅用于验证 SuperApp 原生容器、内部 H5 2 与内部服务端之间的静默单点登录流程。</p>

        <h2>使用资料</h2>
        <ul>
          <li>按应用隔离的 OpenID</li>
          <li>用户昵称</li>
          <li>已验证的手机号和邮箱</li>
          <li>KYC 状态</li>
        </ul>

        <h2>安全边界</h2>
        <p>Customer Token、内部服务私钥、Authorization Code 和 PKCE verifier 不会作为页面数据保存或展示。</p>

        <a class="privacy-link" href="/app">返回内部应用 2</a>
      </article>
      <section class="storage-test-card" data-storage-diagnostics></section>
    </main>
  </body>
</html>
